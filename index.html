
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#292c30">
  <title>Atlas</title>
  <style>
    :root {
      --bg: #292c30;
      --sidebar: #222529;
      --header: #25282c;
      --surface: #32363b;
      --surface-hover: #3a3f45;
      --border: #41464c;
      --text: #e8eaed;
      --muted: #9299a2;
      --accent: #0066A8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 218px;
      min-width: 218px;
      height: 100%;
      background: var(--sidebar);
      border-right: 1px solid #383c41;
      display: flex;
      flex-direction: column;
      padding: 13px 10px 10px;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 1px 2px 15px;
      border-bottom: 1px solid #383c41;
    }

    .social-button {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: default;
      transition: background .15s;
    }

    .social-button:hover {
      background: var(--surface-hover);
    }

    .social-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .social-button.add {
      border: 1px solid var(--border);
      font-size: 19px;
      color: var(--muted);
    }

    /* Browser tabs */
    .tabs {
      flex: 1;
      min-height: 0;
      padding-top: 16px;
    }

    .tab {
      width: 100%;
      height: 39px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #aeb4bc;
      text-align: left;
      cursor: default;
      margin-bottom: 4px;
    }

    .tab svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .tab.selected {
      color: #f1f4f7;
      background: #343a40;
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .tab:hover:not(.selected) {
      background: #2d3136;
      color: var(--text);
    }

    /* Bottom shortcuts */
    .bottom-section {
      border-top: 1px solid #383c41;
      padding-top: 12px;
    }

    .bottom-link {
      width: 100%;
      height: 35px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #aeb4bc;
      text-align: left;
      cursor: default;
      margin-bottom: 2px;
    }

    .bottom-link svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .bottom-link:hover {
      background: #2d3136;
      color: var(--text);
    }

    .collapse {
      width: 100%;
      height: 34px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 11px;
      background: transparent;
      border: 0;
      border-top: 1px solid #383c41;
      color: #858d96;
      cursor: default;
    }

    .collapse svg {
      width: 15px;
      height: 15px;
    }

    /* Main */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 53px;
      min-height: 53px;
      background: var(--header);
      border-bottom: 1px solid #383c41;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 16px;
    }

    .address-wrap {
      width: min(490px, 65%);
      position: relative;
    }

    .address-wrap svg {
      position: absolute;
      width: 15px;
      height: 15px;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #8d959e;
    }

    .address {
      width: 100%;
      height: 32px;
      padding: 0 12px 0 35px;
      background: #303439;
      border: 1px solid #41464c;
      border-radius: 5px;
      color: #dce0e4;
      outline: none;
    }

    .address::placeholder {
      color: #858c94;
    }

    .address:focus {
      border-color: var(--accent);
    }

    .account {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .guest {
      color: #aab0b8;
      margin-right: 5px;
    }

    .account-button {
      height: 30px;
      padding: 0 13px;
      border: 1px solid #4a5057;
      background: transparent;
      border-radius: 4px;
      color: #d9dde1;
      cursor: default;
    }

    .account-button:hover {
      background: var(--surface-hover);
    }

    .account-button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .account-button.primary:hover {
      background: #0877ba;
    }

    /* Home */
    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px 100px;
      overflow: auto;
    }

    .home {
      width: 100%;
      max-width: 570px;
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 33px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
    }

    .brand-name {
      font-size: 37px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -1.8px;
      color: #f0f2f4;
    }

    .brand-name span {
      color: var(--accent);
    }

    .search {
      width: 100%;
      height: 49px;
      display: flex;
      align-items: center;
      background: #34383d;
      border: 1px solid #4a5057;
      border-radius: 6px;
      padding: 0 15px;
      transition: border-color .15s;
    }

    .search:focus-within {
      border-color: var(--accent);
    }

    .search svg {
      width: 19px;
      height: 19px;
      color: #969ea7;
      flex-shrink: 0;
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 12px;
      background: transparent;
      border: 0;
      outline: 0;
      color: white;
      font-size: 14px;
    }

    .search input::placeholder {
      color: #9299a2;
    }

    .search input:focus-visible {
      outline: none;
    }

    /* Home shortcuts */
    .shortcuts {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 19px;
      flex-wrap: wrap;
    }

    .shortcut {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 33px;
      padding: 0 11px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: #a9b0b8;
      cursor: default;
      font-size: 12px;
    }

    .shortcut svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .shortcut:hover {
      background: #34383d;
      border-color: #454b52;
      color: #e1e5e9;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 58px;
        min-width: 58px;
        padding: 10px 6px;
      }

      .socials {
        flex-direction: column;
        gap: 5px;
        padding-bottom: 12px;
      }

      .social-button {
        width: 38px;
      }

      .tab, .bottom-link {
        justify-content: center;
        padding: 0;
      }

      .tab span,
      .bottom-link span,
      .collapse span {
        display: none;
      }

      .collapse {
        justify-content: center;
        padding-left: 0;
      }

      .header {
        padding: 0 12px;
        gap: 8px;
      }

      .account {
        gap: 5px;
      }

      .guest {
        display: none;
      }

      .account-button {
        padding: 0 8px;
        font-size: 11px;
      }

      .content {
        padding-bottom: 50px;
      }

      .brand-name {
        font-size: 32px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
      }
    }

    @media (max-width: 390px) {
      .address-wrap {
        width: 40%;
      }

      .shortcuts {
        gap: 2px;
      }

      .shortcut {
        padding: 0 7px;
      }
    }
  </style>
</head>
<body>

  <!-- Shared category icon designs -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">

      <circle cx="16" cy="12" r=".8" fill="currentColor"/>

      <ellipse cx="17" cy="16" rx="3" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>

  <div class="app">

    <aside class="sidebar">

      <div class="socials">

            <path fill="#FFFFFF" d="m9.55 15.85 6.25-3.85-6.25-3.85v7.7Z"/>
          </svg>
        </button>

        <!-- Spotify -->
        <button class="social-button" aria-label="Spotify">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="12" fill="#1ED760"/>

          </svg>
        </button>

        <!-- Snapchat -->
        <button class="social-button" aria-label="Snapchat">
          <svg viewBox="0 0 24 24" aria-hidden="true">

          </svg>
        </button>

        <!-- Instagram -->
        <button class="social-button" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="instagram-gradient" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFDC80"/>
                <stop offset=".35" stop-color="#F77737"/>
                <stop offset=".68" stop-color="#E1306C"/>
                <stop offset="1" stop-color="#833AB4"/>

            </defs>
            <path fill="url(#instagram-gradient)" d="M7.1 1h9.8A6.1 6.1 0 0 1 23 7.1v9.8a6.1 6.1 0 0 1-6.1 6.1H7.1A6.1 6.1 0 0 1 1 16.9V7.1A6.1 6.1 0 0 1 7.1 1Z"/>

          </svg>
        </button>

        <button class="social-button add" aria-label="Add shortcut">+</button>
      </div>

      <!-- Browser tabs -->
      <div class="tabs">
        <button class="tab selected" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 10 9-7 9 7"/>
            <path d="M5 9v11h14V9M9 20v-7h6v7"/>
          </svg>
          <span>Home</span>
        </button>
      </div>

      <!-- Sidebar category shortcuts -->
      <div class="bottom-section">

        <button class="bottom-link" aria-label="Games">
          <svg><use href="#icon-games"/></svg>
          <span>Games</span>
        </button>

        <button class="bottom-link" aria-label="Music">
          <svg><use href="#icon-music"/></svg>
          <span>Music</span>
        </button>

        <button class="bottom-link" aria-label="Movies">
          <svg><use href="#icon-movies"/></svg>
          <span>Movies</span>
        </button>

        <button class="bottom-link" aria-label="AI">
          <svg><use href="#icon-ai"/></svg>
          <span>AI</span>
        </button>

        <button class="bottom-link" aria-label="Chat">
          <svg><use href="#icon-chat"/></svg>
          <span>Chat</span>
        </button>

      </div>

      <button class="collapse" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
    </aside>

    <main class="main">

      <header class="header">
        <div class="address-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>
          <input class="address" type="text" placeholder="Search or enter address" aria-label="Address bar">
        </div>

        <div class="account">
          <span class="guest">Guest</span>
          <button class="account-button">Sign Up</button>
          <button class="account-button primary">Log In</button>
        </div>
      </header>

      <section class="content">
        <div class="home">

          <div class="brand">
            <svg class="brand-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Atlas logo">
              <path d="M32 5L57 51H7L32 5Z" stroke="#0066A8" stroke-width="4" stroke-linejoin="round"/>
              <path d="M32 5L32 51" stroke="#0066A8" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M18.5 29.5H45.5" stroke="#0066A8" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M11 51H53" stroke="#0066A8" stroke-width="4" stroke-linecap="round"/>
              <path d="M32 5L45.5 29.5L32 51L18.5 29.5L32 5Z" stroke="#1685C5" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <div class="brand-name">Atlas<span>.</span></div>
          </div>

          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-4-4"/>
            </svg>
            <input type="text" placeholder="Search Atlas..." aria-label="Search Atlas">
          </div>

          <!-- Matching category shortcuts -->
          <div class="shortcuts">

            <button class="shortcut">
              <svg><use href="#icon-games"/></svg>
              Games
            </button>

            <button class="shortcut">
              <svg><use href="#icon-movies"/></svg>
              Movies
            </button>

            <button class="shortcut">
              <svg><use href="#icon-music"/></svg>
              Music
            </button>

            <button class="shortcut">
              <svg><use href="#icon-ai"/></svg>
              AI
            </button>

            <button class="shortcut">
              <svg><use href="#icon-chat"/></svg>
              Chat
            </button>

          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
