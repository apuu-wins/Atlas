
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas</title>
<style>
:root {
  --accent: #0066A8;
  --accent-hover: #087cbd;
  --bg: #090d13;
  --sidebar: #0d131b;
  --surface: #111923;
  --surface-hover: #192431;
  --border: #202c39;
  --text: #edf3f8;
  --muted: #82909f;
  --radius: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 75% 15%, rgba(0,102,168,.09), transparent 40%),
    var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: default;
  color: inherit;
}

.app {
  display: flex;
  width: 100%;
  height: 100%;
}

/* Sidebar */

.sidebar {
  width: 248px;
  min-width: 248px;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 25px 17px 17px;
  background: linear-gradient(180deg, #101822, #0c121a);
  border-right: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 2px 8px 27px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: linear-gradient(145deg, #087fbd, #004875);
  box-shadow: 0 4px 15px rgba(0,102,168,.3);
}

.brand-mark svg {
  width: 21px;
  height: 21px;
}

.brand-name {
  font-size: 21px;
  font-weight: 750;
  letter-spacing: -.8px;
}

.brand-name span {
  color: #58a9dc;
}

.section-label {
  padding: 0 9px;
  margin-bottom: 12px;
  color: #647383;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.shortcuts {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 5px 22px;
}

.shortcut {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #141e29;
  transition: background .2s, border-color .2s, transform .2s;
}

.shortcut:hover {
  background: var(--surface-hover);
  border-color: #405365;
  transform: translateY(-2px);
}

.shortcut svg {
  width: 19px;
  height: 19px;
}

.shortcut.add {
  color: #9aa8b7;
  font-size: 22px;
  font-weight: 300;
}

.separator {
  height: 1px;
  background: var(--border);
  margin: 0 3px 22px;
}

.navigation {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  height: 43px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: #a1adba;
  text-align: left;
  font-size: 13px;
  font-weight: 550;
  transition: .18s ease;
}

.nav-item svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.nav-item:hover {
  color: var(--text);
  background: #17222e;
}

.nav-item.active {
  color: #ffffff;
  background: rgba(0,102,168,.19);
  border-color: rgba(0,102,168,.35);
}

.nav-item.active svg {
  color: #47a9e5;
}

.sidebar-spacer {
  flex: 1;
  min-height: 25px;
}

.sidebar-bottom {
  padding-top: 17px;
  border-top: 1px solid var(--border);
}

.categories {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.category {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #8492a1;
  text-align: left;
  font-size: 12px;
  transition: background .18s;
}

.category:hover {
  background: #17222e;
  color: white;
}

.category svg {
  width: 16px;
  height: 16px;
}

.collapse {
  width: 100%;
  height: 37px;
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #121c27;
  color: #8393a3;
}

/* Main layout */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.header {
  height: 69px;
  min-height: 69px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 33px;
  border-bottom: 1px solid var(--border);
  background: rgba(12,18,26,.65);
}

.header-search {
  width: min(340px, 42%);
  height: 37px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #111a24;
  color: var(--muted);
}

.header-search svg {
  width: 16px;
  height: 16px;
}

.header-search input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 12px;
}

.header-search input::placeholder {
  color: #687788;
}

.account {
  display: flex;
  align-items: center;
  gap: 13px;
}

.guest {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 5px;
  color: #a2afbc;
  font-size: 12px;
}

.guest-avatar {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #1e3041;
  color: #a9c5dc;
}

.guest-avatar svg {
  width: 15px;
  height: 15px;
}

.account-button {
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #151e29;
  color: #c5d0da;
  font-size: 11px;
  font-weight: 600;
  transition: .2s;
}

.account-button:hover {
  background: #202d3b;
}

.account-button.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
  box-shadow: 0 3px 12px rgba(0,102,168,.2);
}

.account-button.primary:hover {
  background: var(--accent-hover);
}

/* Home */

.content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.home {
  width: 100%;
  max-width: 690px;
  margin-top: -55px;
  text-align: center;
}

.home-brand {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 17px;
}

.home-logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(0,102,168,.3);
  border-radius: 14px;
  background: linear-gradient(145deg, rgba(0,102,168,.24), rgba(0,102,168,.07));
}

.home-logo svg {
  width: 26px;
  height: 26px;
  color: #43a4dd;
}

.home-title {
  font-size: 35px;
  font-weight: 750;
  letter-spacing: -1.5px;
}

.home-title span {
  color: #43a4dd;
}

.subtitle {
  margin-bottom: 32px;
  color: #8391a0;
  font-size: 13px;
  letter-spacing: .1px;
}

.main-search {
  width: 100%;
  height: 62px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  border: 1px solid #2b4052;
  border-radius: 14px;
  background: linear-gradient(110deg, #141f2b, #111a25);
  box-shadow: 0 12px 35px rgba(0,0,0,.19);
  transition: border-color .2s, box-shadow .2s;
}

.main-search:hover,
.main-search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,102,168,.12), 0 12px 35px rgba(0,0,0,.19);
}

.main-search svg {
  width: 21px;
  height: 21px;
  color: #8499aa;
  flex-shrink: 0;
}

.main-search input {
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  font-size: 14px;
}

.main-search input::placeholder {
  color: #728292;
}

.main-categories {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

.main-category {
  height: 39px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 15px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #111a24;
  color: #9eacba;
  font-size: 12px;
  font-weight: 550;
  transition: .2s ease;
}

.main-category svg {
  width: 16px;
  height: 16px;
}

.main-category:hover {
  border-color: #3b607b;
  background: #192735;
  color: white;
}

.main-category.selected {
  border-color: rgba(0,102,168,.5);
  background: rgba(0,102,168,.16);
  color: #6cb8e6;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #168ed1;
  outline-offset: 3px;
}

/* Responsive */

@media (max-width: 850px) {
  .sidebar {
    width: 205px;
    min-width: 205px;
    padding-left: 12px;
    padding-right: 12px;
  }

  .header {
    padding: 0 20px;
  }

  .main-categories {
    gap: 7px;
  }

  .main-category {
    padding: 0 11px;
  }
}

@media (max-width: 620px) {
  .sidebar {
    width: 65px;
    min-width: 65px;
    padding: 19px 8px 12px;
    align-items: center;
  }

  .brand {
    padding: 0 0 25px;
  }

  .brand-name,
  .section-label,
  .nav-item span,
  .category span {
    display: none;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
  }

  .shortcuts {
    flex-direction: column;
    padding: 0 0 16px;
    gap: 7px;
  }

  .shortcut {
    width: 37px;
    height: 35px;
  }

  .separator {
    width: 100%;
    margin-bottom: 15px;
  }

  .navigation {
    width: 100%;
  }

  .nav-item {
    justify-content: center;
    padding: 0;
    height: 42px;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
  }

  .sidebar-bottom {
    width: 100%;
    padding-top: 12px;
  }

  .category {
    justify-content: center;
    padding: 10px 0;
  }

  .collapse {
    justify-content: center;
    padding: 0;
  }

  .header {
    padding: 0 12px;
    gap: 8px;
  }

  .header-search {
    width: 48%;
  }

  .account {
    gap: 6px;
  }

  .guest {
    gap: 5px;
    font-size: 10px;
  }

  .account-button {
    padding: 0 8px;
    font-size: 10px;
  }

  .content {
    padding: 20px 13px;
  }

  .home {
    margin-top: -25px;
  }

  .home-title {
    font-size: 29px;
  }

  .main-categories {
    flex-wrap: wrap;
  }

  .main-category {
    height: 36px;
    padding: 0 10px;
    font-size: 11px;
  }
}

@media (max-width: 390px) {
  .guest {
    display: none;
  }

  .main-category {
    gap: 5px;
    padding: 0 8px;
  }

  .main-search {
    height: 55px;
    padding: 0 14px;
  }
}
</style>
</head>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <ellipse cx="12" cy="12" rx="4" ry="9"/>

      <button class="shortcut add" aria-label="Add shortcut" title="Add shortcut">+</button>

    <div class="separator"></div>

    <div class="section-label">Workspace</div>

    <nav class="navigation" aria-label="Main navigation">

            <path d="M6 10h12l2 8H4z"/><path d="M8 10l2-4h4l2 4"/><path d="M9 14h.01M15 14h.01"/>

          <span>Games</span>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>
          </svg>
          <span>Movies</span>
        </button>

        <button class="category">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <button class="category">

          <span>AI</span>

        <button class="category">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-2 2v-9.5a7.5 7.5 0 1 1 17 0z"/>

      <button class="collapse" aria-label="Collapse sidebar">

  </aside>

  <main class="main">

          Guest

      </div>

    <section class="content">

        <div class="home-brand">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <ellipse cx="12" cy="12" rx="4" ry="9"/>
              <path d="M3 12h18M5 6.5h14M5 17.5h14"/>
            </svg>
          </div>
          <h1 class="home-title">Atlas<span>.</span></h1>
        </div>

        <p class="subtitle">Everything you need, all in one place.</p>

        <div class="main-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/>
          </svg>
          <input type="text" placeholder="Search Atlas..." aria-label="Search Atlas">
        </div>
