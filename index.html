
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#292c30">
  <title>Atlas</title>

  <style>
    :root {
      --bg: #292c30;
      --sidebar: #222529;
      --header: #25282c;
      --surface: #32363b;
      --surface-hover: #3a3f45;
      --border: #41464c;
      --text: #e8eaed;
      --muted: #9299a2;
      --accent: #0066A8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* Sidebar */

    .sidebar {
      width: 218px;
      min-width: 218px;
      height: 100%;
      background: var(--sidebar);
      border-right: 1px solid #383c41;
      display: flex;
      flex-direction: column;
      padding: 13px 10px 10px;
      z-index: 5;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 1px 2px 15px;
      border-bottom: 1px solid #383c41;
    }

    .social-button {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: default;
      transition: background .15s;
    }

    .social-button:hover {
      background: var(--surface-hover);
    }

    .social-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .social-button.add {
      border: 1px solid var(--border);
      font-size: 19px;
      color: var(--muted);
    }

    .tabs {
      flex: 1;
      min-height: 0;
      padding-top: 16px;
    }

    .tab {
      width: 100%;
      height: 39px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #aeb4bc;
      text-align: left;
      cursor: default;
      margin-bottom: 4px;
    }

    .tab svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .tab.selected {
      color: #f1f4f7;
      background: #343a40;
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .tab:hover:not(.selected) {
      background: #2d3136;
      color: var(--text);
    }

    .bottom-section {
      border-top: 1px solid #383c41;
      padding-top: 12px;
    }

    .bottom-link {
      width: 100%;
      height: 35px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #aeb4bc;
      text-align: left;
      cursor: default;
      margin-bottom: 2px;
    }

    .bottom-link svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .bottom-link:hover {
      background: #2d3136;
      color: var(--text);
    }

    .bottom-link.active {
      background: #343a40;
      color: #f1f4f7;
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .collapse {
      width: 100%;
      height: 34px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 11px;
      background: transparent;
      border: 0;
      border-top: 1px solid #383c41;
      color: #858d96;
      cursor: default;
    }

    .collapse svg {
      width: 15px;
      height: 15px;
    }

    /* Main application */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 53px;
      min-height: 53px;
      background: var(--header);
      border-bottom: 1px solid #383c41;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 16px;
      z-index: 2;
    }

    .address-wrap {
      width: min(490px, 65%);
      position: relative;
    }

    .address-wrap svg {
      position: absolute;
      width: 15px;
      height: 15px;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #8d959e;
    }

    .address {
      width: 100%;
      height: 32px;
      padding: 0 12px 0 35px;
      background: #303439;
      border: 1px solid #41464c;
      border-radius: 5px;
      color: #dce0e4;
      outline: none;
    }

    .address::placeholder { color: #858c94; }

    .address:focus { border-color: var(--accent); }

    .account {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .guest {
      color: #aab0b8;
      margin-right: 5px;
    }

    .account-button {
      height: 30px;
      padding: 0 13px;
      border: 1px solid #4a5057;
      background: transparent;
      border-radius: 4px;
      color: #d9dde1;
      cursor: default;
    }

    .account-button:hover {
      background: var(--surface-hover);
    }

    .account-button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .account-button.primary:hover {
      background: #0877ba;
    }

    /* Home */

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px 100px;
    }

    .home {
      width: 100%;
      max-width: 570px;
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 33px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
    }

    .brand-name {
      font-size: 37px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -1.8px;
      color: #f0f2f4;
    }

    .brand-name span { color: var(--accent); }

    .search {
      width: 100%;
      height: 49px;
      display: flex;
      align-items: center;
      background: #34383d;
      border: 1px solid #4a5057;
      border-radius: 6px;
      padding: 0 15px;
      transition: border-color .15s;
    }

    .search:focus-within {
      border-color: var(--accent);
    }

    .search svg {
      width: 19px;
      height: 19px;
      color: #969ea7;
      flex-shrink: 0;
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 12px;
      background: transparent;
      border: 0;
      outline: 0;
      color: white;
      font-size: 14px;
    }

    .search input::placeholder { color: #9299a2; }

    .search input:focus-visible { outline: none; }

    .shortcuts {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 19px;
      flex-wrap: wrap;
    }

    .shortcut {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 33px;
      padding: 0 11px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: #a9b0b8;
      cursor: default;
      font-size: 12px;
    }

    .shortcut svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .shortcut:hover {
      background: #34383d;
      border-color: #454b52;
      color: #e1e5e9;
    }

    /* Shared category icons */

    .icon-definitions {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* Games view */

    .games-view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      padding: 27px 30px 20px;
    }

    .games-view.visible {
      display: flex;
    }

    .games-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 21px;
      flex-wrap: wrap;
    }

    .games-heading {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.3px;
      color: #eef0f2;
    }

    .games-description {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .games-search-wrap {
      position: relative;
      width: min(310px, 100%);
    }

    .games-search-wrap svg {
      position: absolute;
      width: 16px;
      height: 16px;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #9299a2;
      pointer-events: none;
    }

    .games-search {
      width: 100%;
      height: 35px;
      background: #303439;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 0 12px 0 34px;
      outline: none;
    }

    .games-search::placeholder {
      color: #858c94;
    }

    .games-search:focus {
      border-color: var(--accent);
    }

    /* SDK-provided category filters */

    .category-list {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding: 0 0 14px;
      margin-bottom: 1px;
      scrollbar-width: thin;
      scrollbar-color: #50565d transparent;
    }

    .category-list:empty {
      display: none;
    }

    .category-button {
      flex-shrink: 0;
      height: 29px;
      padding: 0 11px;
      border: 1px solid #41464c;
      border-radius: 4px;
      background: transparent;
      color: #aab0b8;
      font-size: 11px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .category-button:hover {
      background: var(--surface-hover);
      color: white;
    }

    .category-button.selected {
      background: #303d47;
      border-color: #42677f;
      color: #d8eaf5;
    }

    /* Game grid */

    .games-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #50565d transparent;
      padding: 1px 2px 16px 0;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 18px 15px;
    }

    .game-card {
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      overflow: hidden;
      padding: 0;
      text-align: left;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .game-card:hover {
      background: #34383d;
      border-color: #4a5057;
    }

    .game-image-wrap {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #353a40;
      border-radius: 4px;
      position: relative;
    }

    .game-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .2s;
    }

    .game-card:hover .game-image {
      transform: scale(1.035);
    }

    .game-image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #77818b;
    }

    .game-image-placeholder svg {
      width: 30px;
      height: 30px;
    }

    .game-info {
      padding: 9px 8px 10px;
    }

    .game-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e1e5e9;
      font-size: 12px;
      font-weight: 500;
    }

    .game-category {
      display: block;
      margin-top: 4px;
      color: #858e97;
      font-size: 10px;
    }

    /* Loading / empty / error */

    .games-message {
      min-height: 210px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--muted);
      gap: 9px;
      padding: 25px;
    }

    .games-message[hidden] {
      display: none;
    }

    .message-icon {
      width: 35px;
      height: 35px;
      color: #78828c;
      margin-bottom: 3px;
    }

    .message-title {
      font-size: 14px;
      color: #dce0e4;
      font-weight: 500;
    }

    .message-description {
      font-size: 12px;
      color: #9299a2;
      max-width: 340px;
      line-height: 1.6;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #454b52;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .retry-button {
      height: 31px;
      padding: 0 13px;
      margin-top: 7px;
      border: 1px solid #4a5057;
      background: #34383d;
      border-radius: 4px;
      color: #e1e5e9;
      cursor: pointer;
    }

    .retry-button:hover {
      background: #41464c;
    }

    /* Pagination */

    .pagination {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-top: 1px solid #383c41;
      padding-top: 9px;
    }

    .pagination:empty {
      display: none;
    }

    .page-button {
      min-width: 29px;
      height: 27px;
      padding: 0 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: #aeb4bc;
      font-size: 11px;
      cursor: pointer;
    }

    .page-button:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .page-button.current {
      background: #303d47;
      border-color: #42677f;
      color: #e0edf5;
    }

    /* Game player view */

    .player-view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      padding: 17px 22px 20px;
      overflow: auto;
    }

    .player-view.visible {
      display: flex;
    }

    .player-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 39px;
      margin-bottom: 14px;
    }

    .player-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: transparent;
      border: 1px solid #41464c;
      border-radius: 4px;
      color: #c5cbd1;
      font-size: 12px;
      cursor: pointer;
    }

    .player-back:hover {
      background: var(--surface-hover);
      color: white;
    }

    .player-back svg {
      width: 15px;
      height: 15px;
    }

    .player-title {
      margin: 0 auto 0 5px;
      font-size: 13px;
      font-weight: 500;
      color: #e1e5e9;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .fullscreen-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 31px;
      padding: 0 11px;
      background: #34383d;
      border: 1px solid #4a5057;
      border-radius: 4px;
      color: #dce0e4;
      font-size: 11px;
      cursor: pointer;
    }

    .fullscreen-button:hover {
      background: #41464c;
    }

    .fullscreen-button svg {
      width: 14px;
      height: 14px;
    }

    .player-frame-wrap {
      flex: 1;
      min-height: 300px;
      position: relative;
      overflow: hidden;
      background: #171a1d;
      border: 1px solid #41464c;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 300px;
      border: 0;
      background: #171a1d;
    }

    .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #aab0b8;
      background: #171a1d;
      pointer-events: none;
    }

    .player-loading[hidden] {
      display: none;
    }

    /* Responsive */

    @media (max-width: 900px) {
      .games-view {
        padding: 23px 20px 16px;
      }

      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 13px;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 58px;
        min-width: 58px;
        padding: 10px 6px;
      }

      .socials {
        flex-direction: column;
        gap: 5px;
        padding-bottom: 12px;
      }

      .social-button { width: 38px; }

      .tab, .bottom-link {
        justify-content: center;
        padding: 0;
      }

      .tab span,
      .bottom-link span,
      .collapse span {
        display: none;
      }

      .collapse {
        justify-content: center;
        padding-left: 0;
      }

      .header {
        padding: 0 12px;
        gap: 8px;
      }

      .account { gap: 5px; }
      .guest { display: none; }

      .account-button {
        padding: 0 8px;
        font-size: 11px;
      }

      .content { padding-bottom: 50px; }
      .brand-name { font-size: 32px; }
      .brand-logo { width: 42px; height: 42px; }

      .games-view {
        padding: 19px 13px 12px;
      }

      .games-top {
        gap: 12px;
        margin-bottom: 15px;
      }

      .games-search-wrap {
        width: 100%;
      }

      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
        gap: 10px;
      }

      .player-view {
        padding: 12px 10px;
      }

      .player-toolbar {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 390px) {
      .address-wrap { width: 40%; }
      .shortcuts { gap: 2px; }
      .shortcut { padding: 0 7px; }
      .games-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>

  <!-- Shared category icon definitions -->
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-games" viewBox="0 0 24 24">
      <rect x="3" y="7" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 11v4M5 13h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="16" cy="12" r=".8" fill="currentColor"/>
      <circle cx="18" cy="15" r=".8" fill="currentColor"/>
    </symbol>

    <symbol id="icon-music" viewBox="0 0 24 24">
      <path d="M10 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="7" cy="18" rx="3" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <ellipse cx="17" cy="16" rx="3" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>

    <symbol id="icon-movies" viewBox="0 0 24 24">
      <rect x="3" y="7" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="m3 7 3-4h15l-3 4M8 3l-3 4M14 3l-3 4M20 3l-3 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M3 11h18" stroke="currentColor" stroke-width="1.2"/>
    </symbol>

    <symbol id="icon-ai" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="9" y="9" width="6" height="6" rx=".5" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-chat" viewBox="0 0 24 24">
      <path d="M20 11.5a8 8 0 0 1-8 8 8.5 8.5 0 0 1-3.5-.8L4 20l1.3-4.1A8 8 0 1 1 20 11.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="socials">

        <button class="social-button" aria-label="YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#FF0033" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8Z"/>
            <path fill="#FFFFFF" d="m9.55 15.85 6.25-3.85-6.25-3.85v7.7Z"/>
          </svg>
        </button>

        <button class="social-button" aria-label="Spotify">

  <!-- Official LuminSDK browser script, as documented -->
  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

  <script>
    (() => {
      "use strict";

      /* Elements */

      const homeView = document.getElementById("homeView");
      const gamesView = document.getElementById("gamesView");
      const playerView = document.getElementById("playerView");

      const homeTab = document.getElementById("homeTab");
      const gamesSidebar = document.getElementById("gamesSidebar");
      const gamesHome = document.getElementById("gamesHome");

      const gamesGrid = document.getElementById("gamesGrid");
      const gamesMessage = document.getElementById("gamesMessage");
      const gamesSearch = document.getElementById("gamesSearch");
      const categoryList = document.getElementById("categoryList");
      const pagination = document.getElementById("pagination");

      const backToGames = document.getElementById("backToGames");
      const playerTitle = document.getElementById("playerTitle");
      const playerFrame = document.getElementById("playerFrame");
      const playerLoading = document.getElementById("playerLoading");
      const fullscreenButton = document.getElementById("fullscreenButton");

      /* State */

      const PAGE_SIZE = 24;

      let sdkReady = false;
      let sdkInitializing = false;
      let sdkFailed = false;

      let currentPage = 1;
      let currentQuery = "";
      let currentCategory = "";

      let totalPages = 1;
      let currentGames = [];

      let requestVersion = 0;
      let searchTimeout = null;

      let activeGame = null;

      /* Navigation */

      function setNavigation(view) {
        homeView.style.display = view === "home" ? "flex" : "none";
        gamesView.classList.toggle("visible", view === "games");
        playerView.classList.toggle("visible", view === "player");

        homeTab.classList.toggle("selected", view === "home");
        gamesSidebar.classList.toggle("active", view !== "home");
      }

      function openHome() {
        setNavigation("home");
        closePlayer();
      }

      function openGames() {
        setNavigation("games");

        if (!sdkReady) {
          initializeSDK();
        } else if (!currentGames.length) {
          loadGames();
        }
      }

      homeTab.addEventListener("click", openHome);
      gamesSidebar.addEventListener("click", openGames);
      gamesHome.addEventListener("click", openGames);

      /* Status messages */

      function showMessage(type, title, description, retry = false) {
        gamesGrid.innerHTML = "";
        pagination.innerHTML = "";
        gamesMessage.hidden = false;

        if (type === "loading") {
          gamesMessage.innerHTML = `
            <div class="loading-spinner"></div>
            <div class="message-title"></div>
            <div class="message-description"></div>
          `;
        } else {
          gamesMessage.innerHTML = `
            <svg class="message-icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="18" height="12" rx="3"/>
              <path d="M7 11v4M5 13h4M16 12h.01M18 15h.01"/>
            </svg>
            <div class="message-title"></div>
            <div class="message-description"></div>
            ${retry ? '<button class="retry-button" id="retryGames">Try again</button>' : ''}
          `;
        }

        gamesMessage.querySelector(".message-title").textContent = title;
        gamesMessage.querySelector(".message-description").textContent = description;

        if (retry) {
          document.getElementById("retryGames").addEventListener("click", () => {
            sdkFailed = false;
            sdkInitializing = false;
            sdkReady = false;
            initializeSDK();
          });
        }
      }

      function hideMessage() {
        gamesMessage.hidden = true;
      }

      /* SDK initialization */

      async function initializeSDK() {
        if (sdkInitializing) return;

        if (typeof window.Lumin === "undefined") {
          sdkFailed = true;

          showMessage(
            "error",
            "Unable to load the game library",
            "The LuminSDK script could not be loaded. Check your connection or whether the CDN is blocked.",
            true
          );

          return;
        }

        sdkInitializing = true;

        showMessage(
          "loading",
          "Loading games",
          "Connecting to LuminSDK..."
        );

        try {
          await Lumin.init({
            headless: true
          });

          sdkReady = true;
          sdkFailed = false;

          await loadCategories();
          await loadGames();

        } catch (error) {
          console.error("LuminSDK initialization error:", error);

          sdkFailed = true;

          showMessage(
            "error",
            "Couldn't connect to games",
            error.message || "The game library could not be initialized.",
            true
          );

        } finally {
          sdkInitializing = false;
        }
      }

      /* SDK categories */

      async function loadCategories() {
        try {
          const result = await Lumin.getCategories();

          if (!result || !Array.isArray(result.categories)) {
            return;
          }

          const categories = result.categories;

          if (!categories.length) return;

          categoryList.innerHTML = "";

          addCategoryButton("All", "");

          categories.forEach(category => {
            if (typeof category === "string" && category.trim()) {
              addCategoryButton(category, category);
            }
          });

        } catch (error) {
          console.warn("Could not load SDK categories:", error);
          categoryList.innerHTML = "";
        }
      }

      function addCategoryButton(label, value) {
        const button = document.createElement("button");

        button.className = "category-button";
        button.textContent = label;
        button.dataset.category = value;

        if (value === currentCategory) {
          button.classList.add("selected");
        }

        button.addEventListener("click", () => {
          currentCategory = value;
          currentPage = 1;

          categoryList.querySelectorAll(".category-button").forEach(item => {
            item.classList.toggle(
              "selected",
              item.dataset.category === currentCategory
            );
          });

          loadGames();
        });

        categoryList.appendChild(button);
      }

      /* Game catalog */

      async function loadGames() {
        if (!sdkReady) return;

        const version = ++requestVersion;

        currentQuery = gamesSearch.value.trim();

        showMessage(
          "loading",
          "Loading games",
          "Fetching games from the LuminSDK catalog..."
        );

        try {
          let result;

          if (currentCategory) {
            /*
              getGames documents page, limit, and q.
              Category filtering is performed against the actual
              category values returned in SDK game objects.
            */

            const firstPage = await Lumin.getGames({
              page: 1,
              limit: 100,
              q: currentQuery
            });

            const allGames = [...(firstPage.games || [])];
            const pages = Math.max(1, Number(firstPage.pages) || 1);

            for (let page = 2; page <= pages; page++) {
              const next = await Lumin.getGames({
                page,
                limit: 100,
                q: currentQuery
              });

              if (version !== requestVersion) return;

              allGames.push(...(next.games || []));
            }

            const filtered = allGames.filter(game =>
              String(game.category || "").toLowerCase() ===
              currentCategory.toLowerCase()
            );

            const start = (currentPage - 1) * PAGE_SIZE;

            result = {
              games: filtered.slice(start, start + PAGE_SIZE),
              total: filtered.length,
              page: currentPage,
              pages: Math.max(1, Math.ceil(filtered.length / PAGE_SIZE))
            };

          } else {
            result = await Lumin.getGames({
              page: currentPage,
              limit: PAGE_SIZE,
              q: currentQuery
            });
          }

          if (version !== requestVersion) return;

          currentGames = result.games || [];
          totalPages = Math.max(1, Number(result.pages) || 1);
          currentPage = Number(result.page) || currentPage;

          if (!currentGames.length) {
            showMessage(
              "empty",
              "No games found",
              currentQuery || currentCategory
                ? "Try another search or choose a different category."
                : "There are currently no games available in the catalog."
            );
            return;
          }

          hideMessage();

          await renderGames(currentGames, version);
          renderPagination();

        } catch (error) {
          if (version !== requestVersion) return;

          console.error("LuminSDK catalog error:", error);

          showMessage(
            "error",
            "Couldn't load games",
            error.message || "Something went wrong while fetching the game catalog.",
            true
          );
        }
      }

      /* Render real SDK games */

      async function renderGames(games, version) {
        gamesGrid.innerHTML = "";

        const cards = games.map(game => {
          const card = document.createElement("button");

          card.type = "button";
          card.className = "game-card";
          card.setAttribute("aria-label", "Play " + game.name);

          const imageWrap = document.createElement("div");
          imageWrap.className = "game-image-wrap";

          const placeholder = document.createElement("div");
          placeholder.className = "game-image-placeholder";
          placeholder.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round">
              <rect x="3" y="7" width="18" height="12" rx="3"/>
              <path d="M7 11v4M5 13h4M16 12h.01M18 15h.01"/>
            </svg>
          `;

          imageWrap.appendChild(placeholder);

          const info = document.createElement("div");
          info.className = "game-info";

          const title = document.createElement("span");
          title.className = "game-title";
          title.textContent = game.name || "Untitled game";

          const category = document.createElement("span");
          category.className = "game-category";
          category.textContent = game.category || "Game";

          info.appendChild(title);
          info.appendChild(category);

          card.appendChild(imageWrap);
          card.appendChild(info);

          card.addEventListener("click", () => {
            playGame(game);
          });

          gamesGrid.appendChild(card);

          return { game, imageWrap, placeholder };
        });

        /*
          SDK image tokens are resolved through getImageUrl().
          No fabricated thumbnail URLs are used.
        */

        await Promise.all(cards.map(async item => {
          if (!item.game.image_token) return;

          try {
            const imageUrl = await Lumin.getImageUrl(
              item.game.image_token
            );

            if (version !== requestVersion) return;

            const image = document.createElement("img");

            image.className = "game-image";
            image.alt = item.game.name || "Game thumbnail";
            image.loading = "lazy";
            image.src = imageUrl;

            image.addEventListener("error", () => {
              image.remove();
            });

            item.imageWrap.replaceChildren(image);

          } catch (error) {
            console.warn(
              "Could not load game thumbnail:",
              item.game.name,
              error
            );
          }
        }));
      }

      /* Pagination */

      function renderPagination() {
        pagination.innerHTML = "";

        if (totalPages <= 1) return;

        const previous = document.createElement("button");
        previous.className = "page-button";
        previous.textContent = "Previous";
        previous.disabled = currentPage <= 1;

        previous.addEventListener("click", () => {
          if (currentPage <= 1) return;

          currentPage--;
          loadGames();
        });

        pagination.appendChild(previous);

        const maxVisible = 5;

        let start = Math.max(1, currentPage - 2);
        let end = Math.min(totalPages, start + maxVisible - 1);

        start = Math.max(1, end - maxVisible + 1);

        for (let page = start; page <= end; page++) {
          const button = document.createElement("button");

          button.className = "page-button";
          button.textContent = page;

          if (page === currentPage) {
            button.classList.add("current");
            button.setAttribute("aria-current", "page");
          }

          button.addEventListener("click", () => {
            currentPage = page;
            loadGames();
          });

          pagination.appendChild(button);
        }

        const next = document.createElement("button");
        next.className = "page-button";
        next.textContent = "Next";
        next.disabled = currentPage >= totalPages;

        next.addEventListener("click", () => {
          if (currentPage >= totalPages) return;

          currentPage++;
          loadGames();
        });

        pagination.appendChild(next);
      }

      /* Search */

      gamesSearch.addEventListener("input", () => {
        clearTimeout(searchTimeout);

        searchTimeout = setTimeout(() => {
          currentPage = 1;
          loadGames();
        }, 300);
      });

      /* Game player */

      async function playGame(game) {
        if (!sdkReady || !game || !game.id) return;

        activeGame = game;

        setNavigation("player");

        playerTitle.textContent = game.name || "Game";

        playerFrame.hidden = true;
        playerFrame.removeAttribute("src");

        playerLoading.hidden = false;

        fullscreenButton.hidden = true;

        try {
          /*
            Official documented custom-player method.
            The returned URL has a single-use token, so a new
            URL is requested every time a game is launched.
          */

          const result = await Lumin.getGameUrl(game.id);

          if (!result || !result.url) {
            throw new Error("The SDK did not return a playable game URL.");
          }

          if (activeGame !== game) return;

          playerFrame.onload = () => {
            playerLoading.hidden = true;
          };

          playerFrame.hidden = false;

          playerFrame.src = result.url;

          fullscreenButton.hidden =
            typeof playerFrame.requestFullscreen !== "function";

        } catch (error) {
          console.error("Game launch error:", error);

          playerLoading.innerHTML = `
            <svg class="message-icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 8v5M12 16h.01"/>
            </svg>
            <div class="message-title">Couldn't launch this game</div>
            <div class="message-description"></div>
            <button class="retry-button" id="retryGame">Try again</button>
          `;

          playerLoading.querySelector(".message-description").textContent =
            error.message || "The game could not be opened.";

          document.getElementById("retryGame").addEventListener("click", () => {
            playGame(game);
          });
        }
      }

      function closePlayer() {
        activeGame = null;

        playerFrame.onload = null;
        playerFrame.removeAttribute("src");
        playerFrame.hidden = true;

        playerLoading.hidden = false;
        playerLoading.innerHTML = `
          <div class="loading-spinner"></div>
          <span>Loading game...</span>
        `;

        fullscreenButton.hidden = true;
      }

      backToGames.addEventListener("click", () => {
        closePlayer();
        setNavigation("games");
      });

      fullscreenButton.addEventListener("click", async () => {
        if (!playerFrame.requestFullscreen) return;

        try {
          await playerFrame.requestFullscreen();
        } catch (error) {
          console.warn("Fullscreen request was not permitted:", error);
        }
      });

    })();
  </script>

</body>
</html>
